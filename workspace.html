<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   FrameShelf · 글쓰기 연동 시안
  </title>
  <link href="styles.css" rel="stylesheet"/>
  <script src="mock.mjs" type="module">
  </script>
 </head>
 <body>
  <main class="learning-workspace" data-controls-intro="" id="workspace">
   <header class="workspace-bar header-dock">
    <div class="workspace-identity">
     <span class="mock-label">목업</span><span class="course-path">모션 디자인 · 키프레임과 움직임</span>
    </div>
    <div class="workspace-actions"><button class="top-button mobile-video" id="focus-video"><span data-icon="play"></span><span>영상</span></button>
     <button aria-pressed="true" class="top-button active" id="toggle-transcript"><span data-icon="transcript"></span><span>대본</span></button>
     <button aria-pressed="true" class="top-button active" id="toggle-writer"><span data-icon="edit"></span><span>노트</span></button>
     <div class="layout-menu">
      <button aria-controls="layout-popover" aria-expanded="false" aria-haspopup="menu" class="top-button" id="layout-trigger"><span data-icon="menu"></span><span>배치</span><span class="small-chevron">⌄</span></button>
      <div class="menu-popover" hidden="" id="layout-popover" role="menu">
       <button id="save-default" role="menuitem"><span data-icon="check"></span>기본 배치 저장</button>
       <button id="apply-default" role="menuitem"><span data-icon="refresh"></span>기본 배치 적용</button>
      </div>
     </div>
     <button aria-label="전체 화면 전환" class="icon-button" id="fullscreen" title="전체 화면 전환"><span data-icon="fullscreen"></span></button>
    </div>
   </header>
   <div aria-label="크기를 조절하고 이동할 수 있는 패널" class="dock-board" id="board">
    <section aria-label="영상 패널" class="panel video-panel" data-panel="video" id="panel-video">
     <header aria-label="영상 패널 제목, 끌어서 이동" class="panel-header draggable header-dock" data-drag="video" tabindex="0">
      <div class="panel-title">
       <span class="drag-grip" data-icon="grip"></span>
       <span>영상</span>
      </div>
      <div class="panel-header-actions">
       <button aria-label="영상 패널 이동 메뉴" class="icon-button" data-move="video"><span data-icon="move"></span></button>
      </div>
     </header>
     <div class="video-picture">
      <div class="motion-demo" aria-label="움직임의 원리를 보여주는 예시 그래픽"><div class="demo-top"><span class="demo-dot"></span>MOTION STUDIES<span>01 / KEYFRAMES</span></div><div class="motion-grid"><div class="motion-orbit"></div><div class="motion-object"></div><div class="motion-axis"></div><span class="motion-label">느리게 시작해서, 자연스럽게 멈추기.</span></div><div class="demo-timeline"><span>POSITION</span><i></i><b></b><i></i><i></i><span>00:01:58</span></div></div>
      <div class="video-caption">
       두 키프레임 사이의 간격이 움직임의 속도를 만듭니다.
      </div>
      <button aria-label="영상 재생 시연" class="center-play" id="center-play"><span data-icon="play"></span></button>
     </div>
     <div aria-label="영상 재생 제어 시연" class="video-controls">
      <button aria-label="10초 뒤로" class="icon-button" id="back10"><span data-icon="back10"></span></button>
      <button aria-label="재생" class="icon-button" id="play"><span data-icon="play"></span></button>
      <button aria-label="10초 앞으로" class="icon-button" id="forward10"><span data-icon="forward10"></span></button>
      <span class="elapsed" id="elapsed">1:58</span>
      <input aria-label="재생 위치" id="seek" max="1199" min="0" type="range" value="118"/>
      <span class="duration">19:59</span>
      <button aria-label="음소거" class="icon-button volume" id="mute"><span data-icon="volume"></span></button>
      <select aria-label="재생 속도" id="speed">
       <option>1×</option>
       <option>1.25×</option>
       <option>1.5×</option>
       <option>2×</option>
      </select>
      <button aria-label="자막 전환" aria-pressed="true" class="icon-button" id="captions"><span data-icon="captions"></span></button>
     </div>
    </section>
    <section aria-label="대본 패널" class="panel transcript-panel" data-panel="transcript" id="panel-transcript">
     <header aria-label="대본 패널 제목, 끌어서 이동" class="panel-header draggable header-dock" data-drag="transcript" tabindex="0">
      <div class="panel-title">
       <span class="drag-grip" data-icon="grip"></span>
       <span>대본</span>
      </div>
      <div class="panel-header-actions">
       <button aria-pressed="true" class="follow active" id="follow">자동 따라가기</button>
       <button aria-label="대본 패널 이동 메뉴" class="icon-button" data-move="transcript"><span data-icon="move"></span></button>
       <button aria-label="대본 접기" class="icon-button" data-hide="transcript"><span data-icon="close"></span></button>
      </div>
     </header>
     <div class="transcript-scroll" id="transcript-scroll">
      <button class="cue" data-time="68"><time>1:08</time><span>같은 거리라도 움직이는 시간에 따라 느낌이 달라집니다. 먼저 시작점과 끝점을 정해 보겠습니다.</span></button>
      <button class="cue" data-time="75"><time>1:15</time><span>타임라인에 두 개의 키프레임을 놓습니다. 첫 프레임에서는 왼쪽에, 다음 프레임에서는 오른쪽에 오브젝트를 배치합니다.</span></button>
      <button class="cue" data-time="88"><time>1:28</time><span>중간 위치를 직접 그리지 않아도 프로그램이 사이의 움직임을 계산합니다. 중요한 것은 위치보다 시간의 간격입니다.</span></button>
      <button class="cue active" data-time="101"><time>1:41</time><span>키프레임을 가까이 놓으면 빨라지고, 멀리 놓으면 느려집니다. 같은 위치에서 시간을 바꾸며 비교해 보세요.</span></button>
      <button class="cue" data-time="118"><time>1:58</time><span>두 키프레임 사이의 간격이 움직임의 속도를 만듭니다. 이징을 더하면 시작과 끝을 부드럽게 만들 수 있습니다.</span></button>
      <button class="cue" data-time="124"><time>2:04</time><span>이제 움직임을 잠깐 멈추고 노트에 관찰한 내용을 정리해 보겠습니다. 예시 화면의 대본입니다.</span></button>
     </div>
    </section>
    <section aria-label="글쓰기 패널" class="panel writer-panel" data-panel="writer" id="panel-writer">
     <div class="header-dock panel-header-stack">
      <header aria-label="글쓰기 패널 제목, 끌어서 이동" class="panel-header draggable" data-drag="writer" tabindex="0">
       <div class="panel-title">
        <span class="drag-grip" data-icon="grip"></span>
        <span>글쓰기</span><button class="select-post-button" id="select-post" aria-haspopup="dialog" aria-controls="post-picker">글 선택 <span data-icon="chevron"></span></button>
       </div>
       <div class="panel-header-actions">
        <span class="draft-state" id="draft-state"><i></i>자동 저장됨</span>
        <button class="publish-button" id="publish">게시 <span data-icon="chevron"></span></button>
        <button aria-label="글쓰기 패널 이동 메뉴" class="icon-button" data-move="writer"><span data-icon="move"></span></button>
        <button aria-label="글쓰기 접기" class="icon-button" data-hide="writer"><span data-icon="close"></span></button>
       </div>
      </header>
      <div aria-label="글 서식" class="editor-toolbar" role="toolbar">
       <select aria-label="문단 서식" id="block-format">
        <option value="p">본문</option>
        <option value="h2">제목 2</option>
        <option value="h3">제목 3</option>
       </select>
       <span class="toolbar-line"></span>
       <button aria-label="굵게" data-format="bold"><b>B</b></button>
       <button aria-label="기울임" data-format="italic"><i>I</i></button>
       <button aria-label="목록" data-format="insertUnorderedList"><span data-icon="menu"></span></button>
       <span class="toolbar-line"></span>
      </div>
     </div>
     <div class="editor-scroll">
      <div class="editor-page">
       <div class="document-meta"><label class="category-label"><span>카테고리</span><select id="post-category" aria-label="카테고리"><option>학습 기록</option><option>모션 디자인</option><option>개발 노트</option></select></label><span id="post-origin">새 글</span></div>
       <h1 aria-label="글 제목" contenteditable="true" id="note-title" role="textbox" spellcheck="false"></h1>
       <div class="tag-editor"><div id="post-tags" aria-label="부여한 태그"></div><input id="tag-input" aria-label="태그 추가" placeholder="태그 추가" list="tag-options" autocomplete="off" maxlength="30"/><datalist id="tag-options"></datalist></div>
       <div aria-label="글 본문" aria-multiline="true" contenteditable="true" id="note-body" role="textbox" spellcheck="false"></div>
       <p class="editor-mock-note">예시 글입니다. 작성 내용은 이 브라우저에만 저장합니다.</p>
      </div>
     </div>
    </section>
    <div id="splitters">
    </div>
    <div hidden="" id="drop-preview">
     <span></span>
    </div>
   </div>
   <div aria-live="polite" class="status-toast" hidden="" id="status" role="status">
   </div>
   <dialog aria-labelledby="move-title" id="move-dialog">
    <form id="move-form" method="dialog">
     <div class="dialog-heading">
      <h2 id="move-title">
       패널 이동
      </h2>
      <button aria-label="이동 취소" class="icon-button" value="cancel"><span data-icon="close"></span></button>
     </div>
     <label>대상 패널<select id="move-target"><option value="video">영상</option><option value="transcript">대본</option><option value="writer">글쓰기</option><option value="workspace">작업 영역 전체</option></select></label>
     <label>배치 위치<select id="move-edge"><option value="left">왼쪽 분할</option><option value="right">오른쪽 분할</option><option value="top">위쪽 분할</option><option value="bottom">아래쪽 분할</option><option value="center">위치 교환</option></select></label>
     <div class="dialog-actions">
      <button class="secondary-button" value="cancel">취소</button>
      <button class="primary-button" value="move">이동</button>
     </div>
    </form>
   </dialog>
   <dialog id="post-picker" aria-labelledby="picker-title">
    <header class="picker-heading"><div><span class="picker-eyebrow">MY WRITING</span><h2 id="picker-title">글 선택</h2></div><div class="picker-actions"><button class="primary-button" id="create-post"><span data-icon="plus"></span>새 글</button><button class="icon-button" id="close-picker" aria-label="글 선택 닫기"><span data-icon="close"></span></button></div></header>
    <div class="post-tabs" role="tablist" aria-label="글 목록"><button id="draft-tab" role="tab" aria-selected="true" aria-controls="post-results" data-post-tab="drafts">작성 중 <span id="draft-count"></span></button><button id="published-tab" role="tab" aria-selected="false" aria-controls="post-results" data-post-tab="posts">게시글 <span id="published-count"></span></button></div>
    <div class="picker-search"><label><span data-icon="search"></span><input id="post-search" type="search" placeholder="제목이나 태그로 검색" aria-label="글 검색"/></label><select id="tag-filter" aria-label="태그로 필터"><option value="">모든 태그</option></select></div>
    <div id="post-results" class="post-results" role="tabpanel" aria-labelledby="draft-tab"></div>
    <footer class="picker-footer">목업 · 예시 글 목록입니다.</footer>
   </dialog>
   <dialog aria-labelledby="publish-title" id="publish-dialog">
    <header class="dialog-heading"><h2 id="publish-title">게시 미리보기</h2><button aria-label="게시 미리보기 닫기" class="icon-button" id="close-publish"><span data-icon="close"></span></button></header>
    <div class="publication"><span id="publication-category"></span><h1 id="publication-title"></h1><div id="publication-tags" class="publication-tags"></div><div id="publication-body"></div></div>
    <footer class="publication-footer"><span>게시 시연입니다. 실제 블로그에 공개하지 않습니다.</span><button class="primary-button" id="simulate-publish">게시 시연</button></footer>
   </dialog>
  </main>
 </body>
</html>
